<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <style>
      .aperture { animation: rotateLens 8s linear infinite; transform-origin: 60px 60px; }
      .pulse-ring { animation: pulseRing 3s ease-in-out infinite; transform-origin: 60px 60px; }
      .text-main { animation: fadeSlideIn 1s ease forwards 0.3s; opacity: 0; }
      .text-blaze { animation: fadeSlideIn 1s ease forwards 0.6s; opacity: 0; }
      .text-capture { animation: fadeSlideIn 1s ease forwards 0.9s; opacity: 0; }
      .deco-line { animation: drawLine 1.5s ease forwards 1.2s; stroke-dasharray: 90; stroke-dashoffset: 90; }
      .center-dot { animation: pulseDot 2s ease-in-out infinite; transform-origin: 60px 60px; }
      @keyframes rotateLens { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes pulseRing { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.08); opacity: 0.7; } }
      @keyframes fadeSlideIn { to { opacity: 1; transform: translateX(0); } }
      @keyframes drawLine { to { stroke-dashoffset: 0; } }
      @keyframes pulseDot { 0%, 100% { transform: scale(1); opacity: 0.3; } 50% { transform: scale(1.3); opacity: 0.6; } }
      .text-main { transform: translateX(-10px); }
      .text-blaze { transform: translateX(-10px); }
      .text-capture { transform: translateX(-10px); }
    </style>
  </defs>

  <!-- Camera aperture icon -->
  <circle cx="60" cy="60" r="28" fill="none" stroke="#c9a96e" stroke-width="2" class="pulse-ring"/>
  <g class="aperture">
    <circle cx="60" cy="60" r="18" fill="none" stroke="#c9a96e" stroke-width="1.5"/>
    <path d="M60,42 L65,52 L55,52 Z" fill="#c9a96e" opacity="0.7"/>
    <path d="M60,42 L65,52 L55,52 Z" fill="#c9a96e" opacity="0.7" transform="rotate(60 60 60)"/>
    <path d="M60,42 L65,52 L55,52 Z" fill="#c9a96e" opacity="0.7" transform="rotate(120 60 60)"/>
    <path d="M60,42 L65,52 L55,52 Z" fill="#c9a96e" opacity="0.7" transform="rotate(180 60 60)"/>
    <path d="M60,42 L65,52 L55,52 Z" fill="#c9a96e" opacity="0.7" transform="rotate(240 60 60)"/>
    <path d="M60,42 L65,52 L55,52 Z" fill="#c9a96e" opacity="0.7" transform="rotate(300 60 60)"/>
  </g>
  <circle cx="60" cy="60" r="8" fill="#c9a96e" opacity="0.3" class="center-dot"/>

  <!-- Text: CLETUS -->
  <text x="105" y="52" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#f5f5f5" letter-spacing="3" class="text-main">CLETUS</text>
  <!-- Text: BLAZE -->
  <text x="235" y="52" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#c9a96e" letter-spacing="3" class="text-blaze">BLAZE</text>
  <!-- Text: CAPTURE -->
  <text x="105" y="82" font-family="Arial, sans-serif" font-size="11" fill="#888" letter-spacing="8" font-weight="300" class="text-capture">C A P T U R E</text>
  <!-- Decorative line -->
  <line x1="105" y1="92" x2="195" y2="92" stroke="#c9a96e" stroke-width="1" class="deco-line"/>
</svg>
